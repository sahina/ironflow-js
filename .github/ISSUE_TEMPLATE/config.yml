blank_issues_enabled: false
contact_links:
  - name: Report a bug or request a feature
    url: https://github.com/sahina/ironflow-issues/issues/new/choose
    about: All Ironflow issues are tracked in one place. Pick "JS SDK" as the component.
  - name: Security vulnerability
    url: https://github.com/sahina/ironflow-issues/security/advisories/new
    about: Report privately. Do not open a public issue.
  - name: Pull requests
    url: https://github.com/sahina/ironflow-js/blob/main/CONTRIBUTING.md
    about: This repo is read-only. PRs will be closed without review.
